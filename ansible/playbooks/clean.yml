---
- name: Destroy project
  hosts: gcp
  become: true

  vars:
    project_dest: /opt/cloud-1

  tasks:

    - name: vérifier que le projet est déployé
      ansible.builtin.stat:
        path: "{{ project_dest }}/docker-compose.yml"
      register: compose_file

    - name: stop and remove containers, volumes and images
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - down
          - "-v"
          - "--rmi"
          - all
          - "--remove-orphans"
      args:
        chdir: "{{ project_dest }}"
      when: compose_file.stat.exists

    - name: remove project directory and volume data
      ansible.builtin.file:
        path: "{{ project_dest }}"
        state: absent