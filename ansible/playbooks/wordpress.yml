---
- name: Installer WordPress
  hosts: gcp
  become: true

  vars:
    wp_container: wordpress
    wp_path: /var/www/html

  tasks:

    - name: Attendre que wp-config.php soit généré
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - "{{ wp_container }}"
          - test
          - -f
          - "{{ wp_path }}/wp-config.php"
      register: wp_config
      retries: 12
      delay: 5
      until: wp_config.rc == 0
      changed_when: false

    - name: Attendre que MariaDB accepte les connexions
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - mariadb
          - healthcheck.sh
          - --connect
          - --innodb_initialized
      register: db_ready
      retries: 12
      delay: 5
      until: db_ready.rc == 0
      changed_when: false

    - name: Vérifier si WordPress est déjà installé
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - -u
          - www-data
          - "{{ wp_container }}"
          - wp
          - core
          - is-installed
          - "--path={{ wp_path }}"
      register: wp_installed
      failed_when: false
      changed_when: false

    - name: Installer WordPress
      ansible.builtin.shell: |
        docker exec -u www-data {{ wp_container }} sh -c '
          wp core install \
            --path="{{ wp_path }}" \
            --url="$WP_URL" \
            --title="$WP_TITLE" \
            --admin_user="$WP_ADMIN_USER" \
            --admin_password="$WP_ADMIN_PASSWORD" \
            --admin_email="$WP_ADMIN_EMAIL" \
            --skip-email
        '
      when: wp_installed.rc != 0