---
- name: Install Docker on hosts
  hosts: gcp
  become: true

  vars:
    docker_packages:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin

  tasks:
    - name: update apt cache
      apt:
        update_cache: yes

    - name: install required packages
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
        state: present

    - name: create keyrings directory
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: add Docker official GPG key
      get_url:
        url: https://download.docker.com/linux/debian/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'

    - name: add Docker repository
      apt_repository:
        repo: "deb [arch={{ ansible_architecture | regex_replace('x86_64', 'amd64') }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian {{ ansible_distribution_release }} stable"
        state: present
        filename: docker

    - name: update apt cache after adding Docker repository
      apt:
        update_cache: yes

    - name: install Docker and its components
      apt:
        name: "{{ docker_packages }}"
        state: present

    - name: ensure Docker is started and enabled
      systemd:
        name: docker
        state: started
        enabled: true

    - name: add user to the Docker group
      user:
        name: "{{ ansible_user }}"
        groups: docker
        append: true

    - name: install python Docker module for Ansible
      apt:
        name: python3-docker
        state: present